<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f6f8ff"/>
      <stop offset="100%" stop-color="#eefaf3"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a6"/>
    </marker>
  </defs>

  <rect width="960" height="240" rx="16" fill="url(#bg)"/>

  <g>
    <rect x="24" y="60" width="150" height="120" rx="14" fill="#ffffff" stroke="#d7dcea"/>
    <text x="99" y="106" text-anchor="middle" font-size="30">🎙</text>
    <text x="99" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">持续录音</text>
    <text x="99" y="162" text-anchor="middle" font-size="12" fill="#6b7280">每 1 小时切片</text>
  </g>
  <line x1="182" y1="120" x2="214" y2="120" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="222" y="60" width="150" height="120" rx="14" fill="#ffffff" stroke="#d7dcea"/>
    <text x="297" y="106" text-anchor="middle" font-size="30">🤫</text>
    <text x="297" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">静音过滤</text>
    <text x="297" y="162" text-anchor="middle" font-size="12" fill="#6b7280">安静就不上传</text>
  </g>
  <line x1="380" y1="120" x2="412" y2="120" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="420" y="60" width="150" height="120" rx="14" fill="#ffffff" stroke="#d7dcea"/>
    <text x="495" y="106" text-anchor="middle" font-size="30">📝</text>
    <text x="495" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">云端转写</text>
    <text x="495" y="162" text-anchor="middle" font-size="12" fill="#6b7280">百炼 · 分角色</text>
  </g>
  <line x1="578" y1="120" x2="610" y2="120" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="618" y="60" width="150" height="120" rx="14" fill="#ffffff" stroke="#d7dcea"/>
