    <text x="693" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">AI 整理</text>
    <text x="693" y="162" text-anchor="middle" font-size="12" fill="#6b7280">标题 · 摘要 · 星级</text>
  </g>
  <line x1="776" y1="120" x2="808" y2="120" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>

