    <rect x="816" y="60" width="120" height="120" rx="14" fill="#ffffff" stroke="#d7dcea"/>
    <text x="876" y="106" text-anchor="middle" font-size="30">📚</text>
    <text x="876" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">看板 / 日报</text>
    <text x="876" y="162" text-anchor="middle" font-size="12" fill="#6b7280">搜索 · 回看</text>
